name: omp
artifactTypes:
  - type: skill
    locations:
      global: /home/cheta/.omp/agent/skills/
      project: .omp/agent/skills/
    flat: false
    configFormat: null
  - type: plugin
    locations:
      global: /home/cheta/.omp/extensions/
      project: .omp/extensions/
    flat: false
    configFormat: ts
capabilities:
  - type: skill
    dialects: [agent-md]
  - type: plugin
    dialects: [typescript]
  # Declared so a skill that references an MCP server is not rejected whole.
  # The matrix refuses an artifact naming any capability the harness omits,
  # which silently dropped 61 gstack skills from every profile lacking this.
  - type: mcp
    dialects: [single-server]
deployment:
  method: link
  crossDevice: false
  priorStateBackup: true
guidance:
  files:
    - path: /home/cheta/.omp/agent/AGENTS.md
      marker: "<!-- QM: managed -->"
      position: tail