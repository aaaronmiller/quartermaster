name: opencode
artifactTypes:
  - type: skill
    locations:
      global: /home/cheta/.config/opencode/skills/
      project: .config/opencode/skills/
    flat: false
    configFormat: null
  - type: plugin
    locations:
      global: /home/cheta/.config/opencode/plugins/
      project: .config/opencode/plugins/
    flat: false
    configFormat: json
capabilities:
  - type: skill
    dialects: [agent-md]
  - type: plugin
    dialects: [generic]
  # Declared so a skill that references an MCP server is not rejected whole.
  # The matrix refuses an artifact naming any capability the harness omits,
  # which silently dropped 61 gstack skills from every profile lacking this.
  - type: mcp
    dialects: [single-server]
deployment:
  method: link
  crossDevice: false
  priorStateBackup: true
guidance:
  files:
    - path: /home/cheta/.config/opencode/AGENTS.md
      marker: "<!-- QM: managed -->"
      position: tail